<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ivory Hotel &amp; Restaurant — Nairobi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ivory: #FFFFFF;
    --ivory-panel: #FFFFFF;
    --charcoal: #221F1B;
    --charcoal-soft: #4A443C;
    --beige: #D9C6A5;
    --beige-line: #E7E2D8;
    --muted: #8A7F6E;
    --accent: #8A5A34;
    --accent-soft: #F0E4D2;
    --white: #FFFFFF;
    --shadow-color: 34, 31, 27;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ivory);
    color: var(--charcoal);
    font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    display: block;
    padding: 0;
  }

  .stage {
    width: 100%;
    max-width: none;
    background: var(--ivory-panel);
    border-radius: 0;
    box-shadow: none;
    overflow: hidden;
    padding: 28px 16px 0 40px;
  }

  @media (max-width: 720px) {
    .stage { border-radius: 0; padding: 16px 12px 0 16px; }
  }

  /* ---------- NAV ---------- */
  .navbar {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 52px;
    padding: 6px 8px 10px 8px;
  }

  .navbar-spacer {
    flex: 1;
  }

  .brand {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }

  .brand-logo {
    width: 72px;
    height: auto;
    display: block;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 8px;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .nav-links a {
    display: inline-flex;
    align-items: center;
    color: var(--charcoal-soft);
    text-decoration: none;
    font-size: 14.5px;
    font-weight: 500;
    position: relative;
    padding: 8px 14px;
    border: 1px solid #CFC3B2;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.72);
    transition: color 0.25s ease, background 0.25s ease, border-color 0.25s ease;
  }

  .nav-links a::after {
    display: none;
  }

  .nav-links a:hover {
    color: var(--charcoal);
    background: var(--accent-soft);
    border-color: var(--beige);
  }

  .nav-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--charcoal);
    color: var(--ivory-panel);
    border: none;
    border-radius: 999px;
    padding: 11px 22px;
    font-family: 'Work Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: transform 0.25s ease, background 0.25s ease;
  }

  .nav-cta:hover {
    background: var(--accent);
    transform: translateY(-1px);
  }

  .menu-toggle {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px;
    flex-direction: column;
    gap: 5px;
  }

  .menu-toggle span {
    width: 22px;
    height: 1.5px;
    background: var(--charcoal);
    display: block;
    transition: transform 0.3s ease, opacity 0.3s ease;
  }

  /* ---------- HERO ---------- */
  .hero {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 0.92fr);
    gap: 44px;
    align-items: stretch;
    min-height: 520px;
  }

  .hero-content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 4px 4px 4px 8px;
    position: relative;
    z-index: 1;
  }

  .thumb-row {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 17px;
    margin-bottom: 56px;
  }

  .thumb {
    width: 96px;
    height: 128px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 20px -8px rgba(var(--shadow-color), 0.35);
    flex: 0 0 auto;
  }

  .thumb.tall {
    height: 166px;
  }

  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .thumb:nth-child(2) img {
    object-position: center center;
  }

  h1.headline {
    font-family: 'Libre Caslon Display', serif;
    font-weight: 400;
    font-size: clamp(40px, 4.5vw, 56px);
    line-height: 1.06;
    letter-spacing: 0.015em;
    text-transform: uppercase;
    margin: 0;
    color: var(--charcoal);
    opacity: 0;
    transform: translateY(14px);
    animation: riseIn 0.8s ease forwards 0.15s;
    max-width: 20ch;
  }

  .headline-line {
    display: block;
  }

  .headline-line--offset {
    width: max-content;
    margin-left: auto;
    margin-right: auto;
  }

  p.subcopy {
    font-size: 16.5px;
    line-height: 1.65;
    color: var(--muted);
    max-width: none;
    margin: 0 0 38px clamp(1.5rem, 3vw, 3rem);
    opacity: 0;
    transform: translateY(10px);
    animation: riseIn 0.8s ease forwards 0.3s;
  }

  .subcopy-line {
    display: block;
  }

  .subcopy-line--offset {
    width: max-content;
    margin: 0 auto;
  }

  .cta-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    opacity: 0;
    transform: translateY(10px);
    animation: riseIn 0.8s ease forwards 0.42s;
  }

  .cta-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--charcoal);
    color: var(--ivory-panel);
    border: none;
    border-radius: 6px;
    padding: 17px 32px;
    font-family: 'Work Sans', sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s ease, box-shadow 0.3s ease;
    box-shadow: 0 10px 24px -10px rgba(var(--shadow-color), 0.4);
  }

  .cta-primary:hover {
    background: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 14px 30px -10px rgba(var(--shadow-color), 0.45);
  }

  .cta-secondary {
    font-size: 14px;
    color: var(--charcoal-soft);
    text-decoration: none;
    border-bottom: 1px solid var(--beige-line);
    padding-bottom: 3px;
    transition: border-color 0.25s ease, color 0.25s ease;
  }

  .cta-secondary:hover {
    color: var(--charcoal);
    border-color: var(--accent);
  }

  /* ---------- HERO IMAGE ---------- */
  .hero-image {
    position: relative;
    border-radius: 22px;
    overflow: hidden;
    min-height: 420px;
    opacity: 0;
    animation: heroReveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.1s;
  }

  @media (min-width: 981px) {
    .hero {
      min-height: calc(100vh - 117px);
    }

    .hero-content {
      align-items: center;
    }

    .navbar {
      gap: 34px;
    }

    .brand-logo {
      width: 80px;
    }

    .thumb-row {
      gap: 14px;
      margin-bottom: 42px;
      transform: translateY(20px);
    }

    p.subcopy .subcopy-line {
      display: inline;
    }

    p.subcopy .subcopy-line--offset {
      margin-left: 0.3em;
    }

    h1.headline {
      font-size: clamp(38px, 3.35vw, 45px);
      line-height: 1.03;
      letter-spacing: 0.005em;
      max-width: 24ch;
      text-align: center;
    }

    h1.headline .headline-line {
      width: max-content;
      max-width: 100%;
      margin-left: auto;
      margin-right: auto;
    }

    p.subcopy {
      width: max-content;
      max-width: 100%;
      margin-top: 22px;
      margin-left: 0;
      margin-bottom: 30px;
    }

    .cta-primary {
      box-shadow: 0 6px 16px -10px rgba(var(--shadow-color), 0.28);
    }

    .hero-caption {
      left: 36px;
      bottom: 34px;
    }

    .hero-image {
      position: fixed;
      top: 0;
      right: 0;
      width: 46vw;
      height: 100vh;
      min-height: 0;
      margin: 0;
      border-radius: 22px 0 0 22px;
      z-index: 0;
    }
  }

  .hero-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    position: absolute;
    inset: 0;
    content: url("assets/ivoryhotel.jpg");
    object-position: 50% 50%;
  }

  .hero-image::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%);
    z-index: 1;
    pointer-events: none;
  }

  .hero-caption {
    position: absolute;
    left: 30px;
    bottom: 28px;
    z-index: 2;
    color: #FBF8F2;
    font-family: 'Libre Caslon Display', serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(20px, 2vw, 26px);
    line-height: 1.3;
    max-width: 16ch;
  }

  @keyframes riseIn {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes heroReveal {
    from { opacity: 0; transform: scale(1.04); }
    to { opacity: 1; transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .thumb, h1.headline, p.subcopy, .cta-row, .hero-image {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }

  /* ---------- FOOTER STRIP ---------- */
  /* ---------- MOBILE MENU ---------- */
  .mobile-menu {
    position: fixed;
    inset: 0;
    background: var(--ivory);
    z-index: 50;
    display: flex;
    flex-direction: column;
    padding: 26px 26px;
    transform: translateY(-8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .mobile-menu.open {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .mobile-menu-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 50px;
  }

  .mobile-menu-close {
    background: none;
    border: none;
    font-size: 26px;
    color: var(--charcoal);
    cursor: pointer;
    line-height: 1;
  }

  .mobile-menu ul {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }

  .mobile-menu a {
    font-family: 'Libre Caslon Display', serif;
    font-size: 30px;
    color: var(--charcoal);
    text-decoration: none;
    font-weight: 400;
  }

  .mobile-menu .nav-cta {
    margin-top: 40px;
    align-self: flex-start;
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 980px) {
    .stage {
      height: 100svh;
      min-height: 100svh;
      padding-top: 0;
      position: relative;
      overflow: hidden;
    }

    .navbar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 12px;
      z-index: 3;
    }

    .nav-links { display: none; }
    .menu-toggle {
      display: flex;
      width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: #FFFFFF;
      border-radius: 8px;
      padding: 0;
    }
    .menu-toggle span {
      width: 22px;
      height: 1px;
    }
    .hero {
      grid-template-columns: 1fr;
      grid-template-rows: 48svh 52svh;
      gap: 0;
      height: 100%;
      min-height: 0;
    }
    .hero-image {
      order: -1;
      min-height: 0;
      height: 48svh;
      width: 100vw;
      margin-left: -16px;
      margin-right: 0;
      border-radius: 0 0 20px 20px;
      margin-bottom: 0;
    }
    .hero-content {
      min-height: 0;
      height: 52svh;
      justify-content: center;
      padding: 0 2px;
    }
    .thumb-row { gap: 10px; margin-bottom: 8px; }
    .thumb { width: 90px; height: 120px; border-radius: 13px; }
    .thumb.tall { width: 110px; height: 180px; }
    h1.headline {
      max-width: none;
      font-size: clamp(30px, 8vw, 34px);
      line-height: 1.02;
      letter-spacing: 0;
      text-align: center;
    }
    h1.headline .headline-line {
      width: max-content;
      max-width: 100%;
      margin-left: auto;
      margin-right: auto;
    }
    p.subcopy { max-width: none; }
    p.subcopy { margin: 10px 0 20px; text-align: center; }
    .cta-row { justify-content: center; }
    .menu-toggle {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      box-shadow: 0 3px 10px rgba(var(--shadow-color), 0.16);
    }
    .hero-caption {
      left: 20px;
      bottom: 20px;
      font-size: 16px;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.35);
    }
  }

  @media (max-width: 480px) {
    .cta-row {
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .thumb-row { margin-bottom: 8px; }
  }

  @media (max-width: 380px) {
    .hero {
      grid-template-rows: 44svh 56svh;
    }

    .hero-image {
      height: 44svh;
    }

    .thumb-row {
      gap: 8px;
      margin-bottom: 6px;
    }

    .thumb {
      width: 76px;
      height: 100px;
      border-radius: 11px;
    }

    .thumb.tall {
      width: 96px;
      height: 150px;
    }

    h1.headline {
      font-size: 28px;
      line-height: 1;
    }

    p.subcopy {
      font-size: 14px;
      line-height: 1.45;
      margin-top: 8px;
      margin-bottom: 14px;
      max-width: 29ch;
    }

    .cta-primary {
      padding: 15px 28px;
      font-size: 13.5px;
    }
  }

  @media (max-width: 365px) {
    .thumb {
      width: 64px;
      height: 86px;
    }

    .thumb.tall {
      width: 76px;
      height: 108px;
    }
  }
</style>
</head>
<body>

<div class="stage">

  <nav class="navbar">
    <div class="brand">
      <img class="brand-logo" src="assets/logo.png" alt="Ivory Hotel &amp; Restaurant">
    </div>

    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">Dining</a></li>
      <li><a href="#">Stay</a></li>
      <li><a href="#">Gallery</a></li>
      <li><a href="#">Contact</a></li>
    </ul>

    <div class="navbar-spacer"></div>
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="hero">
    <div class="hero-content">
      <div class="thumb-row" aria-label="Ivory Hotel &amp; Restaurant highlights">
        <div class="thumb"><img src="assets/img1.png" alt="Ivory Hotel restaurant interior"></div>

        <span class="headline-line">The Ivory Experience</span>
        <span class="headline-line headline-line--offset">in Kenya</span>
      </h1>
      <p class="subcopy">
        Thoughtful spaces, warm hospitality, and experiences worth returning to.
      </p>

      <div class="cta-row">
        <button class="cta-primary">Book a table</button>
